<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofertas do Kaka — Curadoria de promoções</title>
  <meta name="description" content="Curadoria automatizada de eletrônicos e periféricos.">

  <!-- Verificação de domínio (TikTok e outros portais): substitua o valor de content
       pelo código fornecido pelo portal, mantendo esta meta tag no index.html da raiz. -->
  <meta name="tiktok-developers-site-verification" content="SUBSTITUA_PELO_CODIGO_DA_TIKTOK">
  <meta name="tiktok-developers-verification" content="SUBSTITUA_PELO_CODIGO_DA_TIKTOK">

  <meta property="og:title" content="Ofertas do Kaka">
  <meta property="og:description" content="Curadoria automatizada de eletrônicos e periféricos.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="logo%20ofertas%20kaka.png">

  <style>
    :root {
      --bg-1: #0a0a0d;
      --bg-2: #1a1408;
      --card: rgba(18, 18, 22, 0.92);
      --gold: #d4af37;
      --gold-soft: #f3d98a;
      --text: #f5f5f7;
      --muted: #a9a9b1;
      --line: rgba(212, 175, 55, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(212, 175, 55, 0.18), transparent 60%),
        radial-gradient(800px 500px at 10% 110%, rgba(212, 175, 55, 0.08), transparent 60%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 36px 28px 26px;
      text-align: center;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
    }

    .logo-wrap {
      width: 150px;
      height: 150px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(212, 175, 55, 0.18), rgba(0, 0, 0, 0.4));
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.25);
      overflow: hidden;
    }

    .logo {
      max-width: 88%;
      max-height: 88%;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.35));
    }

    h1 {
      margin: 0;
      font-size: 1.85rem;
      letter-spacing: 0.5px;
      background: linear-gradient(120deg, var(--gold-soft), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin: 8px 0 26px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 0 0 22px;
      opacity: 0.6;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      border: 1px solid transparent;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .btn-telegram {
      background: linear-gradient(135deg, #0099dd, #0077b5);
      box-shadow: 0 8px 20px rgba(0, 136, 204, 0.35);
    }

    .btn-twitter {
      background: #0f0f12;
      border-color: var(--gold);
      color: var(--gold-soft);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    footer {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.82rem;
      color: var(--muted);
    }

    footer a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover { text-decoration: underline; }

    .copyright { margin: 10px 0 0; font-size: 0.75rem; opacity: 0.7; }

    @media (max-width: 480px) {
      .card { padding: 28px 20px 20px; }
      h1 { font-size: 1.6rem; }
      .logo-wrap { width: 128px; height: 128px; }
    }
  </style>
</head>
<body>
  <article class="card">
    <div class="logo-wrap">
      <img class="logo" src="logo%20ofertas%20kaka.png" alt="Logo Ofertas do Kaka (preta e dourada)">
    </div>

    <h1>Ofertas do Kaka</h1>
    <p class="tagline">Curadoria automatizada de eletrônicos e periféricos</p>

    <div class="divider" role="presentation"></div>

    <nav class="links" aria-label="Links oficiais">
      <a class="btn btn-telegram" href="https://t.me/SEU_CANAL_DO_TELEGRAM" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
        Canal no Telegram
      </a>

      <a class="btn btn-twitter" href="https://x.com/SEU_PERFIL_NO_TWITTER" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        Perfil no Twitter / X
      </a>
    </nav>

    <footer>
      <a href="privacidade.html">Política de Privacidade</a>
      <p class="copyright">&copy; Ofertas do Kaka — todos os direitos reservados</p>
    </footer>
  </article>
</body>
</html>
